{% extends "base.html" %}
{% set active_page = 'inventory' %}
{% block title %}Add Item - Book Express{% endblock %}

{% block content %}
<div style="margin-bottom:1rem">
    <a href="/inventory" style="color:var(--primary-color);text-decoration:none;font-size:.9rem">
        <i class="fas fa-arrow-left"></i> Back to Inventory
    </a>
</div>

<div class="section-header">
    <h1>Add Inventory Item</h1>
    <p>Create a new catalogue entry</p>
</div>

<div class="detail-card" style="max-width:850px">
    <h2><i class="fas fa-plus"></i> New Catalogue Item</h2>

    <form method="POST" action="/item/create">
        <div class="detail-grid">
            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="item_id" class="detail-label">Item ID</label>
                <input
                    type="text"
                    id="item_id"
                    name="item_id"
                    value="{{ request.form.item_id if request.method == 'POST' else '' }}"
                    required
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>

            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="item_name" class="detail-label">Book Name</label>
                <input
                    type="text"
                    id="item_name"
                    name="item_name"
                    value="{{ request.form.item_name if request.method == 'POST' else '' }}"
                    required
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>

            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="grade" class="detail-label">Grade Level</label>
                <input
                    type="text"
                    id="grade"
                    name="grade"
                    value="{{ request.form.grade if request.method == 'POST' else '' }}"
                    required
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>

            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="subject" class="detail-label">Subject Category</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    value="{{ request.form.subject if request.method == 'POST' else '' }}"
                    required
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>

            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="unit_price" class="detail-label">Unit Price (JMD)</label>
                <input
                    type="number"
                    id="unit_price"
                    name="unit_price"
                    step="0.01"
                    min="0"
                    value="{{ request.form.unit_price if request.method == 'POST' else '' }}"
                    required
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>

            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="stock_quantity" class="detail-label">Initial Stock Quantity</label>
                <input
                    type="number"
                    id="stock_quantity"
                    name="stock_quantity"
                    min="0"
                    value="{{ request.form.stock_quantity if request.method == 'POST' else '0' }}"
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>

            <div class="detail-row" style="flex-direction:column;align-items:flex-start;gap:.4rem;border-bottom:none">
                <label for="reorder_threshold" class="detail-label">Reorder Threshold</label>
                <input
                    type="number"
                    id="reorder_threshold"
                    name="reorder_threshold"
                    min="0"
                    value="{{ request.form.reorder_threshold if request.method == 'POST' else '5' }}"
                    style="width:100%;padding:.75rem;border:1px solid var(--border-color);border-radius:8px;background:rgba(0,102,255,.1);color:var(--text-primary)"
                >
            </div>
        </div>

        <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem">
            <a href="/inventory" class="btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
            <button type="submit" class="btn-primary">
                <i class="fas fa-save"></i> Create Item
            </button>
        </div>
    </form>
</div>
{% endblock %}
