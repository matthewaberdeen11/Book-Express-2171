<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Express</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f1823, #1a2a42);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center
        }

        .login-box {
            background: rgba(30, 45, 65, .9);
            border: 1px solid rgba(100, 150, 200, .2);
            border-radius: 8px;
            padding: 60px 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, .4)
        }

        .login-box h1 {
            color: #fff;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center
        }

        .subtitle {
            color: #a0a8b0;
            font-size: 15px;
            text-align: center;
            margin-bottom: 40px
        }

        .form-group {
            margin-bottom: 20px
        }

        .form-group input {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid rgba(150, 170, 190, .3);
            border-radius: 5px;
            background: rgba(50, 70, 100, .4);
            color: #fff;
            font-size: 15px;
            transition: all .3s
        }

        .form-group input::placeholder {
            color: rgba(200, 210, 220, .6)
        }

        .form-group input:focus {
            outline: none;
            border-color: #2196f3;
            background: rgba(60, 85, 120, .5);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, .15)
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: rgba(255, 107, 107, .15);
            border-radius: 4px;
            border-left: 3px solid #ff6b6b;
            display: none
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            background: #2196f3;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s;
            margin-top: 15px
        }

        .btn-signin:hover {
            background: #1976d2;
            box-shadow: 0 6px 18px rgba(33, 150, 243, .35)
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Book Express</h1>
        <p class="subtitle">Inventory Management System</p>
        {% if error %}
        <div class="error-message" style="display:block">{{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-signin">Sign In</button>
        </form>
        <p style="color:#a0a8b0;font-size:12px;text-align:center;margin-top:20px">Demo: staff / staff123 or manager /
            manager123</p>
    </div>
</body>

</html>
